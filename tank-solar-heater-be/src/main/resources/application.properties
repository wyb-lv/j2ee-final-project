spring.application.name=tank-solar-heater-be

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TankSolarHeaterDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 'update' so the new payments table is auto-created; existing tables are untouched.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Server dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Number of products returned per page by the /api/products listing endpoints.
app.page-size=4

# ===== Product image uploads (MultipartFile) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Uploaded product images are stored here and served by the backend at /uploads/**.
app.upload.dir=../tank-solar-heater-fe/src/assets/images

# API key from the GEMINI_KEY environment variable.
spring.ai.google.genai.api-key=${GEMINI_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

# Auto-create the SPRING_AI_CHAT_MEMORY table (default only initializes for embedded DBs).
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# ===== VNPay (gateway behind the BANK_TRANSFER payment method) =====
# Sandbox credentials from https://sandbox.vnpayment.vn ; override via env vars in production.
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# VNPay redirects the browser here; the backend records the result then forwards to the storefront.
app.vnpay.return-url=http://localhost:8080/api/payments/vnpay/return
app.vnpay.frontend-return-url=http://localhost:4200/payment-result
app.vnpay.version=2.1.0