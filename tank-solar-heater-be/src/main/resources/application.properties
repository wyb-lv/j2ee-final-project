spring.application.name=tank-solar-heater-be

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TankSolarHeaterDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 'update' so the new payments table is auto-created; existing tables are untouched.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Server dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== Product image uploads (MultipartFile) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# Uploaded product images are stored here and served by the backend at /uploads/**.
app.upload.dir=../tank-solar-heater-fe/src/assets/images