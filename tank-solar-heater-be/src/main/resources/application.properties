spring.application.name=tank-solar-heater-be

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TankSolarHeaterDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 'update' so the new payments table is auto-created; existing tables are untouched.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Server dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect