<div class="adm">
  <!-- Sidebar -->
  <aside class="adm-side" [class.open]="sidebarOpen()">
    <div class="adm-side__brand">
      <h1><span class="mk">☀</span> SunTank</h1>
      <small>Admin Console</small>
    </div>

    <nav class="adm-nav">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="closeSidebar()"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="adm-side__foot">
      <button type="button" (click)="logout()" class="adm-side__link">
        <span class="material-symbols-outlined">logout</span> Log out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="adm-main">
    <header class="adm-top">
      <div class="adm-top__left">
        <button class="adm-iconbtn adm-burger" type="button" (click)="toggleSidebar()" aria-label="Menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h2>Dashboard</h2>
      </div>
      <div class="adm-top__user">
        <div class="adm-top__meta">
          <div class="adm-top__name">{{ auth.user()?.name }}</div>
          <div class="adm-top__role">Administrator</div>
        </div>
        <span class="adm-top__avatar">{{ auth.user()?.name?.charAt(0) }}</span>
      </div>
    </header>

    <main class="adm-content">
      <router-outlet />
    </main>
  </div>
</div>
