<section class="auth">
  <div class="auth__card">
    <a routerLink="/" class="auth__brand">
      <span class="auth__brand-mark">☀</span>
      <span>Sun<span>Tank</span></span>
    </a>

    <h1 class="auth__title">Chào mừng trở lại</h1>
    <p class="auth__sub">Đăng nhập để tiếp tục.</p>

    @if (fromCheckout) {
      <p class="auth__note">🔒 Vui lòng đăng nhập để hoàn tất thanh toán.</p>
    }

    @if (error()) {
      <p class="auth__error">{{ error() }}</p>
    }

    <form #f="ngForm" (ngSubmit)="submit(f.valid !== false)">
      <div class="auth__field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="form.email" required email placeholder="you@email.com" autocomplete="email" />
      </div>
      <div class="auth__field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password" [(ngModel)]="form.password" required placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn--primary auth__submit" [disabled]="submitting()">
        {{ submitting() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="auth__alt">
      Chưa có tài khoản? <a routerLink="/register" [queryParams]="{ returnUrl }">Tạo tài khoản</a>
    </p>
  </div>
</section>
